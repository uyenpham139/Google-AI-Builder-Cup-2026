<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Pulse Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M 64 24 L 92 38 V 64 C 92 84 80 101 64 108 C 48 101 36 84 36 64 V 38 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)"
        opacity="0.95" />

  <!-- Inner Radar / AI Core Waves -->
  <path d="M 52 58 C 56 52 72 52 76 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M 46 68 C 52 60 76 60 82 68" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="64" cy="80" r="4" fill="#ffffff" />
</svg>
